[project]
name = "cvs_search_bar"
authors = [
    { name = "Iftikhar Hussain Syed", email = "iftikhar.hussain@cvshvac.com" }
]
description = "Top-right search bar for the Frappe v16 desk"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
